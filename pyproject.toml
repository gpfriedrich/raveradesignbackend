[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ravera-backend"
version = "0.1.0"
description = "Base da API da Ravera, loja de peças autorais e personalizadas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.3",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
